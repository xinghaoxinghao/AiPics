<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>勘察照片采集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
            color: #1f2937;
            padding-bottom: 80px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px 16px 20px;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
            line-height: 1.5;
        }

        .header .stats {
            display: flex;
            gap: 16px;
            margin-top: 14px;
        }

        .header .stat {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            backdrop-filter: blur(10px);
        }

        .header .stat strong {
            font-size: 16px;
            font-weight: 700;
            margin-right: 4px;
        }

        .tab-bar {
            display: flex;
            background: white;
            padding: 4px;
            margin: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 500;
            color: #6b7280;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .content {
            padding: 0 16px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #374151;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-title small {
            font-size: 12px;
            color: #9ca3af;
            font-weight: 400;
        }

        /* 站点样式 */
        .site-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .site-item {
            background: white;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .site-icon {
            width: 44px;
            height: 44px;
            border-radius: 11px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .site-info {
            flex: 1;
            min-width: 0;
        }

        .site-info .name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #1f2937;
        }

        .site-info .code {
            font-size: 12px;
            color: #9ca3af;
        }

        .site-info .address {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }

        .site-photo-count {
            background: #f3f4f6;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #6b7280;
            flex-shrink: 0;
        }

        .site-actions {
            display: flex;
            gap: 6px;
        }

        .site-actions button {
            border: none;
            background: #f3f4f6;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            color: #6b7280;
            cursor: pointer;
        }

        .site-actions button.delete {
            color: #ef4444;
        }

        /* 空状态 */
        .empty {
            text-align: center;
            padding: 48px 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1f2937;
        }

        .empty p {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 16px;
        }

        /* 浮动按钮 */
        .fab {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab:active {
            transform: scale(0.95);
        }

        /* 照片上传 */
        .photo-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .photo-slot {
            aspect-ratio: 1;
            border: 2px dashed #d1d5db;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            font-size: 12px;
            cursor: pointer;
            background: #fafafa;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
        }

        .photo-slot:active {
            border-color: #667eea;
            background: #f3f4ff;
        }

        .photo-slot .plus {
            font-size: 32px;
            font-weight: 200;
            line-height: 1;
            margin-bottom: 4px;
        }

        .photo-preview {
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            background: #000;
        }

        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-preview .meta {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 20px 8px 6px;
            color: white;
            font-size: 10px;
            line-height: 1.4;
        }

        .photo-preview .delete-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-preview .device-tag {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(102, 126, 234, 0.9);
            color: white;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* 表单 */
        .form-group {
            background: white;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 12px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            background: #f9fafb;
            outline: none;
            transition: all 0.2s;
        }

        .form-input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea.form-input {
            resize: vertical;
            min-height: 72px;
            font-family: inherit;
        }

        .device-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }

        .device-tag-btn {
            padding: 8px 14px;
            border: 1.5px solid #e5e7eb;
            background: white;
            border-radius: 20px;
            font-size: 13px;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.2s;
        }

        .device-tag-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 20px 20px 0 0;
            padding: 24px 20px 32px;
            transform: translateY(100%);
            transition: transform 0.3s;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-overlay.show .modal {
            transform: translateY(0);
        }

        .modal h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1f2937;
            text-align: center;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #4b5563;
        }

        .btn-block {
            width: 100%;
        }

        /* 通知 */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(31, 41, 55, 0.95);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 500;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            backdrop-filter: blur(10px);
        }

        .toast.show {
            opacity: 1;
        }

        /* 照片详情 */
        .photo-detail {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
        }

        .photo-detail img {
            width: 100%;
            max-height: 320px;
            object-fit: contain;
            background: #000;
        }

        .photo-detail .info {
            padding: 14px 16px;
        }

        .photo-detail .info-row {
            display: flex;
            font-size: 13px;
            margin-bottom: 8px;
            color: #4b5563;
        }

        .photo-detail .info-row .label {
            color: #9ca3af;
            width: 70px;
            flex-shrink: 0;
        }

        .photo-detail .info-row .value {
            color: #1f2937;
            flex: 1;
            word-break: break-all;
        }

        /* 项目选择 */
        .project-error {
            background: white;
            margin: 16px;
            padding: 24px 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .project-error .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .project-error h2 {
            font-size: 17px;
            margin-bottom: 8px;
            color: #1f2937;
        }

        .project-error p {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .project-url {
            background: #f9fafb;
            padding: 12px;
            border-radius: 8px;
            font-size: 11px;
            color: #6b7280;
            word-break: break-all;
            margin-bottom: 16px;
            text-align: left;
        }

        /* 导出区域 */
        .export-section {
            background: white;
            padding: 20px 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-top: 16px;
            text-align: center;
        }

        .export-section h3 {
            font-size: 15px;
            margin-bottom: 8px;
        }

        .export-section p {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 16px;
        }

        .file-input {
            display: none;
        }

        .small-btn {
            padding: 10px 16px;
            font-size: 13px;
            border-radius: 8px;
            border: 1.5px solid #e5e7eb;
            background: white;
            color: #4b5563;
            cursor: pointer;
            display: inline-block;
            margin: 4px;
        }

        .small-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .small-btn.danger {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <!-- 通知 Toast -->
    <div id="toast" class="toast"></div>

    <!-- 主内容区 -->
    <div id="app"></div>

    <!-- 添加站点模态框 -->
    <div id="site-modal" class="modal-overlay">
        <div class="modal">
            <h2 id="site-modal-title">新建站点</h2>
            <div class="form-group" style="box-shadow: none; padding: 0; margin-bottom: 0">
                <label class="form-label">站点名称 <span style="color:#ef4444">*</span></label>
                <input id="site-name-input" class="form-input" placeholder="例如：XX路5G基站" />

                <label class="form-label" style="margin-top: 14px">站点编号</label>
                <input id="site-code-input" class="form-input" placeholder="自动生成，可修改" />

                <label class="form-label" style="margin-top: 14px">站点地址</label>
                <input id="site-address-input" class="form-input" placeholder="选填：站点详细地址" />

                <label class="form-label" style="margin-top: 14px">机房类型</label>
                <input id="site-room-input" class="form-input" placeholder="选填：机房/机柜/铁塔等" />
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeSiteModal()">取消</button>
                <button class="btn btn-primary" onclick="saveSite()">保存</button>
            </div>
        </div>
    </div>

    <!-- 照片上传/编辑模态框 -->
    <div id="photo-modal" class="modal-overlay">
        <div class="modal">
            <h2>照片信息</h2>
            <div class="form-group" style="box-shadow: none; padding: 0; margin-bottom: 0">
                <label class="form-label">选择站点 <span style="color:#ef4444">*</span></label>
                <select id="photo-site-select" class="form-input">
                    <option value="">请选择站点</option>
                </select>

                <label class="form-label" style="margin-top: 14px">设备类型（选填）</label>
                <div class="device-tags" id="device-tag-list">
                    <button type="button" class="device-tag-btn" data-type="机柜">机柜</button>
                    <button type="button" class="device-tag-btn" data-type="天线">天线</button>
                    <button type="button" class="device-tag-btn" data-type="电源">电源</button>
                    <button type="button" class="device-tag-btn" data-type="传输">传输</button>
                    <button type="button" class="device-tag-btn" data-type="接地">接地</button>
                    <button type="button" class="device-tag-btn" data-type="环境">环境</button>
                    <button type="button" class="device-tag-btn" data-type="其他">其他</button>
                </div>
                <input id="photo-device-input" class="form-input" placeholder="或自定义输入..." />

                <label class="form-label" style="margin-top: 14px">拍摄时间</label>
                <input id="photo-time-input" class="form-input" readonly style="background: #f3f4f6" />

                <label class="form-label" style="margin-top: 14px">GPS定位</label>
                <input id="photo-gps-input" class="form-input" readonly style="background: #f3f4f6" />

                <label class="form-label" style="margin-top: 14px">文件名称</label>
                <input id="photo-name-input" class="form-input" placeholder="自动生成，可修改" />

                <label class="form-label" style="margin-top: 14px">备注（选填）</label>
                <textarea id="photo-remark-input" class="form-input" placeholder="添加备注信息..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closePhotoModal()">取消</button>
                <button class="btn btn-primary" onclick="savePhoto()">保存照片</button>
            </div>
        </div>
    </div>

    <script>
        // ============== 应用状态 ==============
        const STORAGE_PREFIX = 'survey_mobile_';
        const state = {
            projectId: null,
            projectCode: '',
            projectName: '',
            sites: [],
            photos: [],
            currentTab: 'sites', // sites | photos
            editingSiteId: null,
            pendingPhotos: [], // 待保存的照片 {file, preview, dataUrl, fileName, deviceType, takenAt, latitude, longitude, address, remark, siteId}
            currentPhotoIndex: -1
        };

        // ============== 工具函数 ==============
        function uid(prefix) {
            return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
        }

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.background = type === 'error' ? 'rgba(239, 68, 68, 0.95)' :
                                     type === 'success' ? 'rgba(34, 197, 94, 0.95)' :
                                     'rgba(31, 41, 55, 0.95)';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function formatDate(iso) {
            if (!iso) return '-';
            try {
                const d = new Date(iso);
                return d.toLocaleString('zh-CN', { hour12: false });
            } catch (e) {
                return iso;
            }
        }

        // ============== 数据持久化 ==============
        function getStorageKey(projectId) {
            return `${STORAGE_PREFIX}${projectId}`;
        }

        function saveProjectData() {
            if (!state.projectId) return;
            const data = {
                projectId: state.projectId,
                projectCode: state.projectCode,
                projectName: state.projectName,
                sites: state.sites,
                photos: state.photos,
                updatedAt: new Date().toISOString()
            };
            localStorage.setItem(getStorageKey(state.projectId), JSON.stringify(data));
        }

        function loadProjectData() {
            if (!state.projectId) return;
            try {
                const raw = localStorage.getItem(getStorageKey(state.projectId));
                if (raw) {
                    const data = JSON.parse(raw);
                    state.sites = data.sites || [];
                    state.photos = data.photos || [];
                    if (data.projectCode) state.projectCode = data.projectCode;
                    if (data.projectName) state.projectName = data.projectName;
                }
            } catch (e) {
                console.error('加载数据失败', e);
            }
        }

        // ============== EXIF 解析 ==============
        // 简化版 JPEG EXIF 解析：提取 DateTimeOriginal 和 GPSInfo
        function parseEXIF(arrayBuffer) {
            const result = { takenAt: null, latitude: null, longitude: null };
            try {
                const dataView = new DataView(arrayBuffer);
                const byteLength = dataView.byteLength;

                // JPEG 头校验 0xFFD8
                if (byteLength < 4 || dataView.getUint16(0) !== 0xFFD8) {
                    return result;
                }

                let offset = 2;
                while (offset < byteLength) {
                    if (offset + 2 > byteLength) break;
                    const marker = dataView.getUint16(offset);
                    offset += 2;

                    // APP1 标记 (0xFFE1) - 包含 EXIF
                    if (marker === 0xFFE1 && offset + 2 <= byteLength) {
                        const size = dataView.getUint16(offset);
                        if (offset + size > byteLength) break;

                        // 'Exif\0\0' 签名 (4 bytes: 0x45786966, 2 bytes: 0x0000)
                        if (offset + 8 <= byteLength &&
                            dataView.getUint32(offset + 2) === 0x45786966 &&
                            dataView.getUint16(offset + 6) === 0x0000) {

                            // TIFF Header 起始偏移
                            const tiffOffset = offset + 8;
                            const byteOrder = dataView.getUint16(tiffOffset);
                            const littleEndian = byteOrder === 0x4949;
                            if (!littleEndian && byteOrder !== 0x4D4D) break;

                            // IFD0 偏移
                            const ifd0Offset = dataView.getUint32(tiffOffset + 4, littleEndian);
                            const ifd0Addr = tiffOffset + ifd0Offset;
                            const numEntries = dataView.getUint16(ifd0Addr, littleEndian);

                            // 解析 IFD0 寻找 DateTime (Tag 0x0132 = 306)
                            for (let i = 0; i < numEntries; i++) {
                                const entryAddr = ifd0Addr + 2 + i * 12;
                                if (entryAddr + 12 > byteLength) break;
                                const tag = dataView.getUint16(entryAddr, littleEndian);
                                const type = dataView.getUint16(entryAddr + 2, littleEndian);
                                const count = dataView.getUint32(entryAddr + 4, littleEndian);
                                let valueOffset = entryAddr + 8;

                                // DateTime Tag = 306 (0x0132)
                                if (tag === 306 && type === 2) {
                                    const val = readExifString(dataView, tiffOffset + dataView.getUint32(valueOffset, littleEndian), count);
                                    // 格式: "YYYY:MM:DD HH:MM:SS" -> ISO
                                    const m = val.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
                                    if (m) {
                                        result.takenAt = `${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}`;
                                    }
                                }

                                // GPSInfo Tag = 34853 (0x8825) - IFD 偏移
                                if (tag === 34853) {
                                    const gpsIfdAddr = tiffOffset + dataView.getUint32(valueOffset, littleEndian);
                                    const gps = parseGPSIFD(dataView, gpsIfdAddr, littleEndian, tiffOffset, byteLength);
                                    if (gps) {
                                        result.latitude = gps.latitude;
                                        result.longitude = gps.longitude;
                                    }
                                }
                            }
                        }
                        break;
                    } else if ((marker & 0xFF00) !== 0xFF00) {
                        // 不是有效 marker
                        break;
                    } else {
                        // 跳过其他 segment
                        if (offset + 2 <= byteLength) {
                            offset += dataView.getUint16(offset);
                        } else break;
                    }
                }
            } catch (e) {
                console.warn('EXIF 解析失败:', e);
            }
            return result;
        }

        function readExifString(dataView, offset, length) {
            let str = '';
            for (let i = 0; i < length - 1; i++) {
                if (offset + i < dataView.byteLength) {
                    str += String.fromCharCode(dataView.getUint8(offset + i));
                }
            }
            return str;
        }

        function parseGPSIFD(dataView, ifdAddr, littleEndian, tiffOffset, byteLength) {
            try {
                if (ifdAddr + 2 > byteLength) return null;
                const numEntries = dataView.getUint16(ifdAddr, littleEndian);
                let latRef = 'N', lonRef = 'E';
                let latRational = null, lonRational = null;

                for (let i = 0; i < numEntries; i++) {
                    const entryAddr = ifdAddr + 2 + i * 12;
                    if (entryAddr + 12 > byteLength) break;
                    const tag = dataView.getUint16(entryAddr, littleEndian);
                    const type = dataView.getUint16(entryAddr + 2, littleEndian);
                    const count = dataView.getUint32(entryAddr + 4, littleEndian);
                    let valueOffset = entryAddr + 8;

                    // GPSLatitudeRef (Tag 1) - ASCII "N" 或 "S"
                    if (tag === 1 && type === 2) {
                        const addr = tiffOffset + dataView.getUint32(valueOffset, littleEndian);
                        latRef = String.fromCharCode(dataView.getUint8(addr));
                    }

                    // GPSLatitude (Tag 2) - 3 RATIONAL (度分秒)
                    if (tag === 2 && type === 5 && count === 3) {
                        const addr = tiffOffset + dataView.getUint32(valueOffset, littleEndian);
                        latRational = readRational3(dataView, addr, littleEndian);
                    }

                    // GPSLongitudeRef (Tag 3)
                    if (tag === 3 && type === 2) {
                        const addr = tiffOffset + dataView.getUint32(valueOffset, littleEndian);
                        lonRef = String.fromCharCode(dataView.getUint8(addr));
                    }

                    // GPSLongitude (Tag 4)
                    if (tag === 4 && type === 5 && count === 3) {
                        const addr = tiffOffset + dataView.getUint32(valueOffset, littleEndian);
                        lonRational = readRational3(dataView, addr, littleEndian);
                    }
                }

                if (latRational && lonRational) {
                    let lat = latRational[0] + latRational[1] / 60 + latRational[2] / 3600;
                    let lon = lonRational[0] + lonRational[1] / 60 + lonRational[2] / 3600;
                    if (latRef === 'S') lat = -lat;
                    if (lonRef === 'W') lon = -lon;
                    return { latitude: lat, longitude: lon };
                }
            } catch (e) {
                console.warn('GPS 解析失败:', e);
            }
            return null;
        }

        function readRational3(dataView, offset, littleEndian) {
            const result = [];
            for (let i = 0; i < 3; i++) {
                const num = dataView.getUint32(offset + i * 8, littleEndian);
                const den = dataView.getUint32(offset + i * 8 + 4, littleEndian);
                result.push(den > 0 ? num / den : 0);
            }
            return result;
        }

        function deleteSite(siteId) {
            const site = state.sites.find(s => s.id === siteId);

            const photoCount = state.photos.filter(p => p.siteId === siteId).length;
            const msg = photoCount > 0

                state.sites = state.sites.filter(s => s.id !== siteId);
                state.photos = state.photos.filter(p => p.siteId !== siteId);

                renderApp();

        // ============== 照片处理 ==============
        function triggerPhotoSelect() {
            if (state.sites.length === 0) {
                if (confirm('当前没有站点，是否先创建一个站点？')) {
                    switchTab('sites');
                    openSiteModal();
                    return;
                }
                return;
            }
            document.getElementById('photo-file-input').click();
        }

        async function handlePhotoFiles(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            state.pendingPhotos = [];

            for (const file of Array.from(files)) {
                // 读取文件为 DataURL
                const dataUrl = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });

                // 读取 EXIF 信息
                let exif = { takenAt: null, latitude: null, longitude: null };
                try {
                    const arrayBuffer = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsArrayBuffer(file);
                    });
                    exif = parseEXIF(arrayBuffer);
                } catch (e) {
                    console.warn('读取EXIF失败', e);
                }

                const takenAt = exif.takenAt || new Date().toISOString();
                const baseName = file.name.replace(/\.[^.]+$/, '');

                state.pendingPhotos.push({
                    file,
                    dataUrl,
                    fileName: baseName,
                    deviceType: '',
                    takenAt,
                    latitude: exif.latitude,
                    longitude: exif.longitude,
                    remark: '',
                    siteId: state.sites.length > 0 ? state.sites[0].id : null
                });
            }

            event.target.value = ''; // reset

            // 处理第一张照片
            if (state.pendingPhotos.length > 0) {
                state.currentPhotoIndex = 0;
                openPhotoModal();
            }
        }

        function openPhotoModal(photoId) {
            // 更新站点下拉
            const select = document.getElementById('photo-site-select');
            select.innerHTML = '<option value="">请选择站点</option>' +
                state.sites.map(s => `<option value="${s.id}">${escapeHtml(s.code)} - ${escapeHtml(s.name)}</option>`).join('');

            // 如果是编辑已有照片
            let photo;
            if (photoId) {
                photo = state.photos.find(p => p.id === photoId);
                if (photo) {
                    state.currentPhotoIndex = -1;
                    state._editingPhotoId = photoId;
                }
            } else {
                state._editingPhotoId = null;
                photo = state.pendingPhotos[state.currentPhotoIndex];
            }

            if (!photo) return;

            select.value = photo.siteId || (state.sites[0] && state.sites[0].id) || '';
            document.getElementById('photo-device-input').value = photo.deviceType || '';
            document.getElementById('photo-name-input').value = photo.fileName || '';
            document.getElementById('photo-time-input').value = formatDate(photo.takenAt);
            document.getElementById('photo-gps-input').value =
                (photo.latitude && photo.longitude)
                    ? `${photo.latitude.toFixed(6)}, ${photo.longitude.toFixed(6)}`
                    : '无 GPS 信息';
            document.getElementById('photo-remark-input').value = photo.remark || '';

            // 重置设备标签
            document.querySelectorAll('.device-tag-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === photo.deviceType);
                btn.onclick = () => {
                    document.querySelectorAll('.device-tag-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById('photo-device-input').value = btn.dataset.type;
                    photo.deviceType = btn.dataset.type;
                };
            });

            document.getElementById('photo-modal').classList.add('show');
        }

        function closePhotoModal() {
            document.getElementById('photo-modal').classList.remove('show');
            state.currentPhotoIndex = -1;
            state._editingPhotoId = null;
        }

        function savePhoto() {
            // 编辑已有照片
            if (state._editingPhotoId) {
                const photo = state.photos.find(p => p.id === state._editingPhotoId);
                if (photo) {
                    photo.siteId = document.getElementById('photo-site-select').value;
                    photo.deviceType = document.getElementById('photo-device-input').value.trim();
                    photo.fileName = document.getElementById('photo-name-input').value.trim() || photo.fileName;
                    photo.remark = document.getElementById('photo-remark-input').value.trim();

                    if (!photo.siteId) {
                        showToast('请选择站点', 'error');
                        return;
                    }

                    saveProjectData();
                    showToast('照片信息已更新', 'success');
                    closePhotoModal();
                    renderApp();
                }
                return;
            }

            // 保存待处理的新照片
            const photo = state.pendingPhotos[state.currentPhotoIndex];
            if (!photo) return;

            photo.siteId = document.getElementById('photo-site-select').value;
            photo.deviceType = document.getElementById('photo-device-input').value.trim();
            photo.fileName = document.getElementById('photo-name-input').value.trim() || photo.fileName;
            photo.remark = document.getElementById('photo-remark-input').value.trim();

            if (!photo.siteId) {
                showToast('请选择站点', 'error');
                return;
            }

            // 将 pendingPhoto 保存为正式 photo
            const site = state.sites.find(s => s.id === photo.siteId);
            const seq = String(state.photos.filter(p => p.siteId === photo.siteId).length + 1).padStart(3, '0');
            const dt = new Date(photo.takenAt);
            const dateStr = `${dt.getFullYear()}${String(dt.getMonth() + 1).padStart(2, '0')}${String(dt.getDate()).padStart(2, '0')}`;
            const autoName = `${site ? site.code : 'SITE'}_${dateStr}_${seq}`;

            state.photos.push({
                id: uid('photo'),
                projectId: state.projectId,
                siteId: photo.siteId,
                originalName: photo.fileName,
                fileName: photo.fileName || autoName,
                fileUrl: photo.dataUrl,
                thumbnailUrl: photo.dataUrl,
                deviceType: photo.deviceType,
                remark: photo.remark,
                takenAt: photo.takenAt,
                latitude: photo.latitude,
                longitude: photo.longitude,
                uploadedAt: new Date().toISOString(),
                isManualNamed: false
            });

            saveProjectData();

            // 处理下一张或关闭
            if (state.currentPhotoIndex < state.pendingPhotos.length - 1) {
                state.currentPhotoIndex++;
                const remaining = state.pendingPhotos.length - state.currentPhotoIndex;
                showToast(`已保存 ${state.currentPhotoIndex}/${state.pendingPhotos.length}`, 'success');

                // 打开下一张
                const nextPhoto = state.pendingPhotos[state.currentPhotoIndex];
                const select = document.getElementById('photo-site-select');
                select.value = nextPhoto.siteId || (state.sites[0] && state.sites[0].id) || '';
                document.getElementById('photo-device-input').value = nextPhoto.deviceType || '';
                document.getElementById('photo-name-input').value = nextPhoto.fileName || '';
                document.getElementById('photo-time-input').value = formatDate(nextPhoto.takenAt);
                document.getElementById('photo-gps-input').value =
                    (nextPhoto.latitude && nextPhoto.longitude)
                        ? `${nextPhoto.latitude.toFixed(6)}, ${nextPhoto.longitude.toFixed(6)}`
                        : '无 GPS 信息';
                document.getElementById('photo-remark-input').value = nextPhoto.remark || '';
                document.querySelectorAll('.device-tag-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.type === nextPhoto.deviceType);
                    btn.onclick = () => {
                        document.querySelectorAll('.device-tag-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        document.getElementById('photo-device-input').value = btn.dataset.type;
                        nextPhoto.deviceType = btn.dataset.type;
                    };
                });
            } else {
                showToast(`全部 ${state.pendingPhotos.length} 张照片已保存`, 'success');
                closePhotoModal();
                state.pendingPhotos = [];
                renderApp();
            }
        }

        function editPhoto(photoId) {
            openPhotoModal(photoId);
        }

        function deletePhoto(photoId) {
            if (confirm('确定删除这张照片吗？')) {
                state.photos = state.photos.filter(p => p.id !== photoId);

                showToast('照片已删除', 'success');

        // ============== 导入导出 ==============
        function exportJSON() {
            const data = {
                version: '1.0',
                exportedAt: new Date().toISOString(),
                project: {
                    id: state.projectId,
                    code: state.projectCode,
                    name: state.projectName
                },
                sites: state.sites,
                photos: state.photos
            };
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `survey-${state.projectCode}-${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('数据已导出', 'success');
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);

                    if (!confirm(`将导入 ${data.sites ? data.sites.length : 0} 个站点, ${data.photos ? data.photos.length : 0} 张照片。\n\n注意: 与现有数据重复的站点/照片将被合并。`)) {
                        event.target.value = '';
                        return;
                    }

                    // 合并站点: 按 code 去重
                    const existingCodes = new Set(state.sites.map(s => s.code));
                    const siteIdMap = {}; // 旧ID -> 现有ID or 新ID

                    if (data.sites && data.sites.length) {
                        for (const site of data.sites) {
                            if (existingCodes.has(site.code)) {
                                const existing = state.sites.find(s => s.code === site.code);
                                siteIdMap[site.id] = existing.id;
                            } else {
                                const newSite = {
                                    id: uid('site'),
                                    projectId: state.projectId,
                                    name: site.name,
                                    code: site.code,
                                    address: site.address,
                                    roomType: site.roomType,
                                    createdAt: site.createdAt || new Date().toISOString()
                                };
                                state.sites.push(newSite);
                                siteIdMap[site.id] = newSite.id;
                                existingCodes.add(site.code);
                            }
                        }
                    }

                    // 合并照片
                    if (data.photos && data.photos.length) {
                        for (const photo of data.photos) {
                            const newSiteId = siteIdMap[photo.siteId] || photo.siteId;
                            state.photos.push({
                                id: uid('photo'),
                                projectId: state.projectId,
                                siteId: newSiteId,
                                originalName: photo.originalName || photo.fileName,
                                fileName: photo.fileName,
                                fileUrl: photo.fileUrl,
                                thumbnailUrl: photo.thumbnailUrl || photo.fileUrl,
                                deviceType: photo.deviceType,
                                remark: photo.remark,
                                takenAt: photo.takenAt,
                                latitude: photo.latitude,
                                longitude: photo.longitude,
                                uploadedAt: photo.uploadedAt || new Date().toISOString(),
                                isManualNamed: photo.isManualNamed || false
                            });
                        }
                    }

                    saveProjectData();
                    renderApp();
                    showToast(`导入成功: ${data.sites ? data.sites.length : 0} 站点, ${data.photos ? data.photos.length : 0} 照片`, 'success');
                } catch (err) {
                    console.error(err);
                    showToast('导入失败: 文件格式错误', 'error');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function clearAllData() {
            if (confirm('⚠️ 确定清空所有数据吗？此操作不可撤销！\n将删除当前项目下的所有站点和照片。')) {
                state.sites = [];
                state.photos = [];
                saveProjectData();
                renderApp();
                showToast('数据已清空', 'success');
            }
        }

        // ============== 辅助 ==============
        function escapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // 初始化
        initFromUrl();
    </script>
</body>
</html>
